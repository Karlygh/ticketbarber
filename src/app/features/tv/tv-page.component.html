@switch (activeView()) {
  @case ('cards-light') {
    <app-tv-cards-light-view
      [vm]="viewModel()"
      [switchingView]="switchingView()"
      (changeView)="cycleView()" />
  }
  @case ('view-3') {
    <app-tv-placeholder-view
      [vm]="viewModel()"
      [switchingView]="switchingView()"
      (changeView)="cycleView()" />
  }
  @default {
    <app-tv-default-view
      [vm]="viewModel()"
      [switchingView]="switchingView()"
      (changeView)="cycleView()" />
  }
}
